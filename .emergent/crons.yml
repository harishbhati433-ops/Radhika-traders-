crons:
  - name: attendance-nudges
    description: "Every 15 min Mon-Sat 7:00 AM-11:45 PM IST: check-in reminders after office start, check-out reminders after office end (push + email, one of each per employee per day); also auto-closes forgotten sessions"
    # UTC schedule (01:30-18:15 UTC = 07:00-23:45 IST) — wide enough for any admin-set office/auto-close time. Non-UTC timezone does not allow */15 or hour ranges, so this must stay in UTC.
    cron: "*/15 1-18 * * 1-6"
    endpoint: "{{BASE_URL}}/api/cron/attendance-nudges"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: selfie-cleanup
    description: "Deletes attendance selfies older than the admin-set retention (default 60 days) every night at 2:30 AM IST"
    cron: "30 2 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/selfie-cleanup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: visitor-report
    description: "Emails the admin an anonymous daily website-visitor count report every night at 12:00 AM IST (covers the day just ended)"
    cron: "0 0 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/visitor-report"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: email-retry
    description: "Every 5 min: re-send emails that failed because the email provider was down or rate-limited (5 → 10 → 15 → 30 → 60 → 120 min schedule)"
    cron: "*/5 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/email-retry"
    method: POST
    headers:
      Authorization: "Bearer {{WEBHOOK_CRON_SECRET}}"
      Content-Type: "application/json"
    body: '{"event":"schedule.triggered"}'
