crons:
  - name: attendance-nudges
    description: "Every 15 min Mon-Sat 8:30 AM-7:15 PM IST: emails check-in reminders after office start and check-out reminders after office end (one of each per employee per day)"
    # UTC schedule (03:00-13:45 UTC = 08:30-19:15 IST). Non-UTC timezone does not allow */15 or hour ranges, so this must stay in UTC.
    cron: "*/15 3-13 * * 1-6"
    endpoint: "{{BASE_URL}}/api/cron/attendance-nudges"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: selfie-cleanup
    description: "Deletes attendance selfies older than the admin-set retention (default 60 days) every night at 2:30 AM IST"
    cron: "30 2 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/selfie-cleanup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: email-retry
    description: "Every 5 min: re-send emails that failed because the email provider was down or rate-limited (5 → 10 → 15 → 30 → 60 → 120 min schedule)"
    cron: "*/5 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/email-retry"
    method: POST
    headers:
      Authorization: "Bearer {{WEBHOOK_CRON_SECRET}}"
      Content-Type: "application/json"
    body: '{"event":"schedule.triggered"}'
